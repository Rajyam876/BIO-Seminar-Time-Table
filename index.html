
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIO Seminar Time Table</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

  <style>
        body {
            background-color: #f5f5f5;
            font-family: "Times New Roman", serif;
        }

        .seminar-box {
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background-color: #e9f0f2;
        }

        h3 {
            text-align: center;
            font-size: 22px;
        }

        table {
            width: 100%;
            border: 2px solid #777;
            border-spacing: 5px;
            border-collapse: separate;
        }

        th, td {
            border: 1px solid #777 !important;
            padding: 10px 6px !important;
            text-align: center;
            vertical-align: middle;
        }

        th {
            font-weight: bold;
        }

        .day {
            font-weight: bold;
        }

        .topic {
            text-align: left;
        }
    </style>

  
</head>

<body>

<div class="container">
    <div class="seminar-box">

        <h3>BIO</h3>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th rowspan="3">Day</th>
                    <th colspan="3">Seminar</th>
                </tr>

                <tr>
                    <th colspan="2">Schedule</th>
                    <th rowspan="2">Topic</th>
                </tr>

                <tr>
                    <th>Begin</th>
                    <th>End</th>
                </tr>
            </thead>

            <tbody>
                <!-- Monday -->
                <tr>
                    <td rowspan="2" class="day">Monday</td>
                    <td rowspan="2">8.00 am.</td>
                    <td rowspan="2">5.00 pm.</td>
                    <td class="topic">Introduction to HTML</td>
                </tr>

                <tr>
                    <td class="topic">Validity: DTD and Relax NG</td>
                </tr>

                <!-- Tuesday -->
                <tr>
                    <td rowspan="3" class="day">Tuesday</td>
                    <td>8.00 am.</td>
                    <td>5.00 pm.</td>
                    <td>XPath</td>
                </tr>

                <tr>
                    <td>11.00 am.</td>
                    <td>02.00 pm.</td>
                    <td rowspan="2">XSL Transformations</td>
                </tr>

                <tr>
                    <td>02.00 pm.</td>
                    <td>05.00 pm.</td>
                </tr>

                <!-- Wednesday -->
                <tr>
                    <td class="day">Wednesday</td>
                    <td>8.00 am.</td>
                    <td>12.00 pm.</td>
                    <td class="topic">XSL Formatting Objects</td>
                </tr>
            </tbody>
        </table>

    </div>
</div>

</body>
</html>
